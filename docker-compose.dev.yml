services:
  gemini-web-to-openai-proxy:
    # Build the image locally from this checkout.
    #   docker compose -f docker-compose.dev.yml up -d --build
    build: .
    image: gemini-web-to-openai-proxy:dev
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      GEMINI_PROXY_LOG_LEVEL: INFO
      # pin the admin password (else one is generated and logged on first boot)
      # ADMIN_PASSWORD: "change-me"
    volumes:
      # your config.json + cookies.json (see config.example.json / README.md)
      - ./deploy/config:/config
      # rotated-cookie cache, activity.db, admin_credential — MUST persist across recreates
      - ./gwop-data:/data
