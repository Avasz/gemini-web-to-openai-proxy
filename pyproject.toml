[project]
name = "gemini-openai-proxy"
version = "0.1.0"
description = "Gemini Web -> OpenAI-compatible API gateway"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "avasz" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gemini_webapi>=2.1,<2.2",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gemini-openai-proxy = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
